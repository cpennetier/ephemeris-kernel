[package]
name = "ephemeris-des"
version = "0.1.0"
edition = "2021"
description = "Ephemeris Kernel Tier 1 Discrete Event Simulator"

[lib]
name = "ephemeris_des"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
arrow = { version = "55", features = ["ipc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Schema fingerprint (sorted column-name digest) + controller_config_hash in the
# run manifest. sha2 0.10 is the de-facto RustCrypto SHA-2 impl, actively
# maintained, pure-Rust, no transitive C — negligible binary-size impact.
sha2 = "0.10"

[dev-dependencies]
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
# H3 golden-equivalence gate (tests/h3_equivalence.rs) ONLY. The engine performs
# no runtime H3: the node→cell mapping is atlas-pinned (computed offline by the
# node serializer, read by io.rs). The gate proves h3o ≡ Python h3 so that
# offline pipeline can trust h3o. Stays a dev-dependency.
# default-features=false selects the `libm` math backend: h3o's `std` backend
# declares `const fn mul_add`, which is not const-stable even on rustc 1.91.
h3o = { version = "0.10", default-features = false }

[features]
default = ["pyo3"]
python = ["pyo3"]

[[bench]]
name = "des_throughput"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
