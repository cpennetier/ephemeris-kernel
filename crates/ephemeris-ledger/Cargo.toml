[package]
name = "ephemeris-ledger"
version = "0.1.0"
edition = "2021"
description = "Ephemeris Kernel capacity ledger"

[lib]
name = "ephemeris_ledger_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
arrow = { version = "55", features = ["ipc"], optional = true }
arrow-pyarrow = { version = "55", optional = true }
dashmap = "6"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1"

[features]
default = ["pyo3", "arrow", "arrow-pyarrow"]
python = ["pyo3", "arrow", "arrow-pyarrow"]
arrow_only = ["arrow"]

[[bench]]
name = "ledger_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
